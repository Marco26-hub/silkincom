<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C2D8ED"/>
      <stop offset="55%" stop-color="#9FC0DC"/>
      <stop offset="100%" stop-color="#80AECC"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3878A8"/>
      <stop offset="60%" stop-color="#2C5E88"/>
      <stop offset="100%" stop-color="#1E4A6E"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4B48C"/>
      <stop offset="100%" stop-color="#A89462"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(10,25,40,0.30)"/>
    </radialGradient>
    <linearGradient id="warmOverlay" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="rgba(200,165,85,0.14)"/>
      <stop offset="100%" stop-color="rgba(200,165,85,0)"/>
    </linearGradient>
    <!-- Linen fiber gradient - golden straw tone -->
    <linearGradient id="fiberMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8D5A0"/>
      <stop offset="40%" stop-color="#D4BC7A"/>
      <stop offset="100%" stop-color="#B89A52"/>
    </linearGradient>
    <linearGradient id="fiberLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EFE0B0"/>
      <stop offset="50%" stop-color="#F5EBCA"/>
      <stop offset="100%" stop-color="#DFC888"/>
    </linearGradient>
    <linearGradient id="fiberShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4A85C"/>
      <stop offset="100%" stop-color="#A88C40"/>
    </linearGradient>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="fiberSoft">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="shadowDrop">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="rgba(15,35,55,0.28)"/>
    </filter>
  </defs>

  <!-- SKY -->
  <rect width="900" height="700" fill="url(#sky)"/>

  <!-- Far mountains -->
  <ellipse cx="100" cy="235" rx="200" ry="95" fill="#90AAA0" opacity="0.45"/>
  <ellipse cx="820" cy="240" rx="170" ry="80" fill="#88A49A" opacity="0.40"/>

  <!-- Mountain range back -->
  <path d="M0,320 Q70,185 170,205 Q250,168 350,190 Q440,150 530,178 Q615,148 700,172 Q780,158 860,185 Q890,195 900,205 L900,345 L0,345Z" fill="#6A8C7C" opacity="0.50"/>
  <!-- Mountain range mid -->
  <path d="M0,345 Q110,255 210,275 Q320,248 420,268 Q520,242 620,262 Q720,248 820,265 L900,272 L900,395 L0,395Z" fill="#527A6A" opacity="0.62"/>
  <!-- Mountain range near -->
  <path d="M0,375 Q140,298 270,314 Q400,295 530,308 Q655,290 780,305 Q848,298 900,308 L900,415 L0,415Z" fill="#456A58" opacity="0.72"/>

  <!-- WATER -->
  <rect x="0" y="405" width="900" height="155" fill="url(#water)"/>
  <!-- Water shimmer -->
  <line x1="40" y1="425" x2="190" y2="425" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
  <line x1="280" y1="438" x2="460" y2="438" stroke="rgba(255,255,255,0.11)" stroke-width="1"/>
  <line x1="580" y1="422" x2="740" y2="422" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <line x1="120" y1="452" x2="280" y2="452" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <line x1="480" y1="462" x2="660" y2="462" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>
  <line x1="130" y1="478" x2="330" y2="478" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <line x1="680" y1="445" x2="850" y2="445" stroke="rgba(255,255,255,0.11)" stroke-width="1"/>
  <path d="M0,405 Q150,432 300,422 Q460,412 600,428 Q750,418 900,412 L900,452 Q750,442 600,455 Q460,465 300,448 Q150,458 0,442Z" fill="rgba(42,82,118,0.38)"/>

  <!-- SHORE -->
  <path d="M0,545 Q200,515 400,525 Q600,515 800,528 L900,534 L900,700 L0,700Z" fill="url(#ground)"/>
  <!-- Ground stones -->
  <ellipse cx="160" cy="572" rx="20" ry="9" fill="rgba(155,138,105,0.5)"/>
  <ellipse cx="310" cy="582" rx="26" ry="11" fill="rgba(148,130,98,0.45)"/>
  <ellipse cx="530" cy="568" rx="22" ry="9" fill="rgba(152,134,102,0.42)"/>
  <ellipse cx="710" cy="578" rx="24" ry="10" fill="rgba(145,127,95,0.5)"/>
  <ellipse cx="835" cy="562" rx="17" ry="8" fill="rgba(158,140,108,0.42)"/>

  <!-- LINEN FIBER BUNDLE - main element -->
  <g filter="url(#shadowDrop)" transform="translate(450,470)">

    <!-- Individual fiber strands - bundle of ~18 strands -->
    <!-- Each strand is a slightly wavy path, golden-straw color -->
    <!-- Back strands (darker) -->
    <path d="M-55,-110 Q-52,-50 -50,20 Q-48,80 -52,120" stroke="#B89850" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M-42,-115 Q-38,-55 -36,20 Q-34,85 -38,122" stroke="#BE9E56" stroke-width="5.5" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M55,-108 Q52,-48 50,22 Q48,82 52,120" stroke="#B89850" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M42,-113 Q38,-53 36,22 Q34,87 38,122" stroke="#BE9E56" stroke-width="5.5" fill="none" stroke-linecap="round" opacity="0.75"/>

    <!-- Mid strands -->
    <path d="M-28,-118 Q-22,-55 -20,18 Q-18,88 -22,124" stroke="url(#fiberMain)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M-14,-122 Q-10,-58 -8,20 Q-6,90 -10,126" stroke="url(#fiberLight)" stroke-width="6.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M0,-124 Q4,-60 4,20 Q4,92 0,128" stroke="url(#fiberMain)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.92"/>
    <path d="M14,-122 Q10,-58 8,20 Q6,90 10,126" stroke="url(#fiberLight)" stroke-width="6.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M28,-118 Q22,-55 20,18 Q18,88 22,124" stroke="url(#fiberMain)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>

    <!-- Front strands (lighter, more prominent) -->
    <path d="M-68,-105 Q-64,-42 -62,25 Q-60,78 -65,118" stroke="#C8AC6A" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.80"/>
    <path d="M68,-103 Q64,-40 62,26 Q60,80 65,118" stroke="#C8AC6A" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0.80"/>

    <!-- Highlight strands (almost white-gold) -->
    <path d="M-6,-124 Q-2,-60 0,20 Q2,92 -2,128" stroke="#EFE0B0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.75"/>
    <path d="M8,-122 Q12,-58 10,20 Q8,90 12,126" stroke="#F0E2B2" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.65"/>

    <!-- Binding wrap at center (raffia tie) -->
    <ellipse cx="0" cy="8" rx="52" ry="12" fill="#8B6E2E" opacity="0.6"/>
    <path d="M-52,0 Q-48,8 -52,16 Q-20,22 0,20 Q20,22 52,16 Q48,8 52,0 Q20,6 0,8 Q-20,6 -52,0Z" fill="#7A5F24" opacity="0.75"/>
    <path d="M-52,4 Q0,14 52,4" stroke="#C8A448" stroke-width="1.5" fill="none" opacity="0.5"/>

    <!-- Bottom fiber spread / frayed ends -->
    <path d="M-20,128 Q-18,145 -22,165" stroke="#C4A85C" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M-8,128 Q-6,148 -10,168" stroke="#D4BC70" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"/>
    <path d="M4,128 Q6,146 2,164" stroke="#C8B060" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M16,126 Q18,144 14,162" stroke="#CCAE5E" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M28,124 Q30,140 26,158" stroke="#C4A858" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M-32,124 Q-34,140 -30,156" stroke="#C2A654" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55"/>

    <!-- Top fiber tips frayed -->
    <path d="M-6,-124 Q-10,-138 -8,-150" stroke="#EBD898" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M8,-122 Q12,-136 10,-148" stroke="#E8D494" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.50"/>
    <path d="M0,-124 Q-4,-140 -2,-152" stroke="#EAD896" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.52"/>
  </g>

  <!-- Smaller fiber bundle left -->
  <g transform="translate(240,528) scale(0.55) rotate(-8)">
    <path d="M-14,-100 Q-10,-45 -8,20 Q-6,75 -10,105" stroke="url(#fiberMain)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M0,-105 Q4,-48 4,20 Q4,78 0,108" stroke="url(#fiberLight)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M14,-100 Q10,-45 8,20 Q6,75 10,105" stroke="url(#fiberMain)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
    <ellipse cx="0" cy="8" rx="36" ry="9" fill="#7A5F24" opacity="0.6"/>
  </g>

  <!-- Smaller fiber bundle right -->
  <g transform="translate(672,532) scale(0.48) rotate(6)">
    <path d="M-12,-95 Q-8,-42 -6,18 Q-4,70 -8,98" stroke="url(#fiberMain)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M0,-98 Q4,-44 4,18 Q4,72 0,100" stroke="url(#fiberLight)" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M12,-95 Q8,-42 6,18 Q4,70 8,98" stroke="url(#fiberMain)" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
    <ellipse cx="0" cy="8" rx="32" ry="8" fill="#7A5F24" opacity="0.6"/>
  </g>

  <!-- Warm unifying overlay -->
  <rect width="900" height="700" fill="url(#warmOverlay)"/>
  <!-- Vignette -->
  <rect width="900" height="700" fill="url(#vignette)"/>
  <!-- Horizon haze -->
  <rect x="0" y="362" width="900" height="55" fill="rgba(195,215,235,0.22)" filter="url(#softBlur)"/>
</svg>
